name: CI Tests and SonarCloud

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened]

jobs:
  tests-and-sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      env:
      DJANGO_SETTINGS_MODULE: fitboostracker.settings
      PYTHONUNBUFFERED: "1"
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
      ZIP_FILE: fitboostracker-app-package.zip
      

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run Django tests with coverage
        run: |
          coverage run manage.py test
          coverage xml

      - name: SonarCloud Scan
        # uses the full sha for the correct version
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=OmkarNCI_Fitboostracker_CDOS_Project
            -Dsonar.organization=omkarnci            
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=.
            -Dsonar.projectBaseDir=.

        # generate the deployment ZIP files
      - name: Create Deployment ZIP
        if: success()
        run: |
          zip -r $ZIP_FILE . -x "*.git*" "*__pycache__*" "*.pytest_cache*" "*.sqlite3" "*.coverage"

      - name: Configure AWS Credentials
        # uses the full sha for the correct version
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload ZIP to S3
        if: success()
        run: |
          aws s3 cp $ZIP_FILE s3://$S3_BUCKET/$ZIP_FILE