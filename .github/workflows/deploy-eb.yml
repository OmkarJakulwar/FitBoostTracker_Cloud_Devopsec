name: Deploy to Elastic Beanstalk

# Runs this deploy file only when CI Tests and SonarCLoud workflow is completed.
on:
  workflow_run:
    workflows: ["CI Tests and SonarCloud"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      EB_APP_NAME: ${{ secrets.EB_APP_NAME }}
      EB_ENV_NAME: ${{ secrets.EB_ENV_NAME }}
      S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
      ZIP_FILE: fitboostracker-app-package.zip 

    steps:
        # Configuring the aws credentials for access to the lab
      - name: Configure AWS Credentials
        # uses the full sha for the correct version
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

        # Deploy to ElasticBeanstalk 
      - name: Create new EB application deploy version from S3
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name $EB_APP_NAME \
            --version-label "deploy-${{ github.run_number }}" \
            --source-bundle S3Bucket="$S3_BUCKET",S3Key="$ZIP_FILE"

      - name: Deploy new version to EB
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name $EB_ENV_NAME \
            --version-label "deploy-${{ github.run_number }}"

